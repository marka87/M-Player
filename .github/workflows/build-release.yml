name: Build & Release M-Player

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (z.B. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install FFmpeg and Deno
        run: |
          choco install ffmpeg deno --no-progress

      - name: Generate Logo and Icons
        run: |
          python scripts/generate_logo.py

      - name: Build Windows Portable Archive
        run: |
          python build_portable.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/M-Player-Portable-*.zip
          retention-days: 7

  build-linux:
    name: Build Linux AppImage & Tarball
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libpulse0 \
            libasound2 \
            libnss3 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-render-util0 \
            libxcb-image0 \
            libxcb-xinerama0 \
            libfuse2 \
            curl \
            wget \
            file \
            binutils

      - name: Install appimagetool
        run: |
          sudo wget -q -O /opt/appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /opt/appimagetool.AppImage
          cd /opt
          sudo /opt/appimagetool.AppImage --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          rm -f /opt/appimagetool.AppImage
          appimagetool --version || echo "appimagetool installed successfully"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Generate Logo and Icons
        run: |
          python scripts/generate_logo.py

      - name: Build Linux Tarball & AppImage
        run: |
          sed -i 's/\r$//' build_linux.sh
          chmod +x build_linux.sh
          bash ./build_linux.sh

      - name: Upload Linux Portable Tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: dist/M-Player-Linux-*.tar.gz
          retention-days: 7

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release-assets/

      - name: Download Linux Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: release-assets/

      - name: Download Linux AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: M-Player ${{ steps.vars.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
